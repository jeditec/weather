events {
    worker_connections 1024;
}

http {
    # ── Upstream: the Node.js app ──
    upstream weather-dashboard {
        server weather-dashboard:8040;
    }

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80;
        server_name _;  # replace with your domain: server_name weather.example.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──
    server {
        listen 443 ssl http2;
        server_name weather.example.com;  # ← REPLACE with your domain

        ssl_certificate      /etc/letsencrypt/live/weather.example.com/fullchain.pem;   # ← REPLACE
        ssl_certificate_key  /etc/letsencrypt/live/weather.example.com/privkey.pem;   # ← REPLACE
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Forward to weather dashboard ──
        location / {
            proxy_pass         http://weather-dashboard;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
